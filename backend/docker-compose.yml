# Local PostgreSQL with pgvector for vector RAG.
# Usage: docker compose up -d
# Then set spring.datasource.* and portal.rag.retrieval-mode=vector (or hybrid) in application.properties or env.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      - "5432:5432"
    volumes:
      - portal_pgdata:/var/lib/postgresql/data

volumes:
  portal_pgdata:
