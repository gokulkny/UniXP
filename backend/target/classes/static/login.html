<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UniPortal - Login</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/index.html">UniPortal</a>
      <nav class="nav-links" aria-label="Primary">
        <a href="/index.html">Home</a>
        <a href="/admissions.html">Admissions</a>
        <a href="/courses.html">Courses</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="main-card" style="max-width: 520px; margin-left:auto; margin-right:auto;">
      <h1 style="margin:0 0 10px 0;">Login</h1>
      <p class="muted" style="margin:0 0 16px 0;">
        Demo only. Password must be <code>demo</code>.
      </p>

      <div id="loginError" class="error" hidden></div>

      <form id="loginForm">
        <div style="margin-bottom: 12px;">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" placeholder="e.g. gokul" required />
        </div>
        <div style="margin-bottom: 12px;">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="demo" required />
        </div>
        <button type="submit" style="width:100%;">Sign in</button>
      </form>
    </section>
  </main>

  <footer>
    <div class="container">
      UniPortal Demo &copy; 2026
    </div>
  </footer>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
