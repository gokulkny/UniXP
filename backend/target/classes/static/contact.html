<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UniPortal - Contact</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/index.html">UniPortal</a>
      <nav class="nav-links" aria-label="Primary">
        <a href="/index.html">Home</a>
        <a href="/admissions.html">Admissions</a>
        <a href="/courses.html">Courses</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="main-card">
      <h1 style="margin:0 0 10px 0;">Contact</h1>
      <p class="muted" style="margin:0 0 16px 0;">
        This is a demo portal page. The form is UI-only (no backend).
      </p>

      <form>
        <div class="grid">
          <div class="col-6">
            <label for="contactName">Name</label>
            <input id="contactName" name="name" placeholder="Your name" />
          </div>
          <div class="col-6">
            <label for="contactEmail">Email</label>
            <input id="contactEmail" name="email" type="email" placeholder="you@example.com" />
          </div>
          <div class="col-12" style="margin-top: 2px;">
            <label for="contactMessage">Message</label>
            <textarea id="contactMessage" name="message" rows="5" placeholder="How can we help?" style="resize: vertical;"></textarea>
          </div>
          <div class="col-12" style="margin-top: 8px;">
            <div class="btn-row">
              <button type="button">Send (Demo)</button>
              <button type="button" class="secondary" onclick="window.location.href='/courses.html'">Browse Courses</button>
            </div>
          </div>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <div class="container">
      UniPortal Demo &copy; 2026
    </div>
  </footer>
</body>
</html>
