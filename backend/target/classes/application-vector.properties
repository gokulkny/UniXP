# Activate with: spring.profiles.active=vector
# (or SPRING_PROFILES_ACTIVE=vector). Requires Postgres + pgvector (see docker-compose.yml).
spring.config.activate.on-profile=vector

portal.rag.retrieval-mode=vector
portal.rag.similarity-min-score=0.35
portal.rag.max-retry-variants=4

# Embeddings: 1536 -> table rag_chunk; 4096 -> table rag_chunk_4096 (see Flyway V3).
# portal.embedding.model=openai/text-embedding-3-small
# portal.embedding.dimension=1536
# Example (Qwen 8B): model returns 4096-d vectors; dimension must match the table.
portal.embedding.model=qwen/qwen3-embedding-8b
portal.embedding.dimension=4096
# Large embeddings models often need 90–180s+ per request. Chat timeout is separate (PORTAL_OPENROUTER_TIMEOUT_SECONDS).
portal.embedding.timeout-seconds=180

spring.datasource.url=jdbc:postgresql://localhost:5432/portal
spring.datasource.username=portal
spring.datasource.password=portal

# Use hybrid instead of pure vector:
# portal.rag.retrieval-mode=hybrid
