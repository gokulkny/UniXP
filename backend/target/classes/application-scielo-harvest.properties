# Opt-in profile: does not load unless spring.profiles.active includes scielo-harvest
# Activate with other profiles you already use, e.g. legacy RAG:
#   cd backend
#   mvn spring-boot:run -Dspring-boot.run.profiles=legacy,scielo-harvest
# Manifest path is relative to the JVM working directory (often the folder you run Maven from).
portal.scielo.harvest.enabled=true
portal.scielo.harvest.run-on-startup=true
portal.scielo.harvest.startup-max-articles=5
portal.scielo.harvest.startup-manifest-path=target/scielo-harvest/startup-manifest.ndjson
portal.scielo.harvest.collection=scl
portal.scielo.harvest.articlemeta-base-url=http://articlemeta.scielo.org
portal.scielo.harvest.identifiers-limit-per-request=200
portal.scielo.harvest.delay-between-requests-ms=250
portal.scielo.harvest.http-timeout-seconds=60
