# Default profile: legacy RAG (no local Postgres). For pgvector, run with spring.profiles.active=vector
# (see application-vector.properties). See README.md.
spring.profiles.default=legacy

# Comma-separated Google Drive PDF file IDs to index for the chatbot RAG.
# Example:
# portal.drive.fileIds=1AbcD...xyz,2DefG...uvw
portal.drive.fileIds=1li5ArL8mi8fSk2-6UzdM4UaoXMkSw4pk, 17D_YrX38-8rx9jtjYAblQ-9Dg7JiraMm

# RAG: legacy (in-memory TF-IDF), vector (pgvector + embeddings), hybrid (vector + keyword rerank)
portal.rag.retrieval-mode=legacy

# Embeddings (OpenRouter OpenAI-compatible /v1/embeddings; use same key as chat or set PORTAL_OPENROUTER_API_KEY)
portal.embedding.base-url=https://openrouter.ai/api/v1
portal.embedding.model=openai/text-embedding-3-small
portal.embedding.dimension=1536

