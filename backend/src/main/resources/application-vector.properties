# Activate with: spring.profiles.active=vector
# (or SPRING_PROFILES_ACTIVE=vector). Requires Postgres + pgvector (see docker-compose.yml).
spring.config.activate.on-profile=vector

portal.rag.retrieval-mode=vector

spring.datasource.url=jdbc:postgresql://localhost:5432/portal
spring.datasource.username=portal
spring.datasource.password=portal

# Use hybrid instead of pure vector:
# portal.rag.retrieval-mode=hybrid
